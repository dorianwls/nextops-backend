services:
   db:
      image: postgres:16-alpine
      container_name: nextops_postgresdb
      restart: always
      environment:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: Admin123!
         POSTGRES_DB: nextops_db
      ports:
         - "5432:5432"
      volumes:
         - pg_data:/var/lib/postgresql/data

volumes:
   pg_data:
